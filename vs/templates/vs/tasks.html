{% load VSAuthorizer %}
{% cotton basicLayout title=Tasks help='/vs/help?tasks'%}
<script type="text/javascript">
	function loaded() {}
</script>
{% VSAuthorizer _type=ADD_TASK %}
   <form action='addTask'  method="POST">
        {% csrf_token %}
       <table cellpadding="5" class="centered">
           <th colspan="2"><h3>Add Task</h3></th>
           <tr>
               <td>
                   <table class="centered">
                       <tr>
                           <td class="label">
                               <label for="taskSequence"
                                              rendered="true"
                                              value="Sequence Number:"/>
                           </td>
                           <td>
                               <input type='text'
                               				id="taskSequence"
                               				name="taskSequence"
                               				inputmode="numeric" 
                               				pattern="\d{1,5}"
                                            size="4"
                                            maxlength="5"/>
                           </td>
                           <td width="2%"/>
                           <td class="label">
                               <label for="taskName"
                                              rendered="true"
                                              value="Task Name:"/>
                           </td>
                           <td>
                               <input type='text' 
                               				id="taskName"
                               				name="taskName"
                                            size="30"
                                            maxlength='255'/>
                           </td>
                       </tr>
                   </table> 
               </td>
           </tr>             
           <tr>
               <td>   
                   <table class="centered">
                       <tr>
                           <td align="center">
                               <input type='submit' 
                       				class="reset-style"
                                     value="Add Task"
                                     action="add"/>
                               &nbsp&nbsp
	                    	<button 
			                    type="button" 
			                    onclick="window.location.href='/vs/projectEdit?id={{ projecttID }}'">
		                    	Cancel
		                    </button>
                           </td>
                       </tr>  
                   </table> 
               </td>
           </tr> 
       </table>
   </form>
   {{ tasksTable|safe }}
{% VSAuthorizer_end %}
{% endcotton %}
