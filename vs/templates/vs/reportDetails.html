{% csrf_token %}
<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      
      
      
      >

    <body>
        <ui:composition template="./../template/default.xhtml">
            <ui:define name="content">
                <script>
                    function loaded() {
                        setHeader("Report Edit");
                    }
                </script>
                {% if test="#{Authorizerauthorize(AuthorizerRESOURCE_UPDATE_REPORT)}">
                    <h:form>
                        <table align="center">
                            <th><h3>${reportBean.title}</h3></th>
                            <tr>
                                <td>
                                    <p:commandButton
                                        styleClass="reset-style"
                                        value="View Report"
                                        onclick="this.form.target = '_blank';"
                                        action="${reportBean.view()}"/>&nbsp;
                                    <p:commandButton
                                        styleClass="reset-style"
                                        value="Delete"
                                        onclick="this.form.target = ''"
                                        action="${reportBean.delete()}"/>&nbsp;
                                    <p:commandButton
                                        styleClass="reset-style"
                                        value="Cancel"
                                        onclick="this.form.target = ''"
                                        action="${reportBean.cancel()}"/>
                                </td>
                            </tr>
                        </table>
                    </h:form>
                {% endif %}
            </ui:define>
        </ui:composition>
    </body>
</html>
