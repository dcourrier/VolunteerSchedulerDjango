{% load VSAuthorizer %}
{% cotton basicLayout title='Skill Edit' help='/vs/help?skillEdit'%}
<script type="text/javascript">
	function loaded() {}
</script>
<form action='/vs/skillUpdate' method='post'>
{% csrf_token %}
  <input type="hidden" id="oid" name="oid" value="{{oid}}"/>
	<table class='centered'>
        <c-errorMessage :err='err'></c-errorMessage> 
        <tr align='center'>
            <td><label for='name'>Name: </label>
               <input type='text' 
               			id="name"
               			name='name'
                        size="30"
                        value="{{name}}"
                        maxlength="{{NameMaxLength}}"/>
          </td></tr>
          <tr>
{% VSAuthorizer _type=UPDATE_SKILL %}
            <td align='center'>
                	<input type="submit" 
                	class="reset-style"
                	name="action" 
                	value="Save"/>&nbsp;
{% VSAuthorizer_end %} 
{% VSAuthorizer _type=DELETE_SKILL %}
					<input type="submit" 
					class="reset-style"
					name="action" 
					value="Delete"/>&nbsp;
{% VSAuthorizer_end %}
                    <button 
	                    type="button" 
	                    onclick="window.location.href='skills'">
                    	Cancel
                    </button>
                </td></tr>
    </table>
</form> 
{% endcotton %}
