{% load VSAuthorizer %}
{% cotton basicLayout title=Locations help='/vs/help?locations'%}
{% VSAuthorizer _type=ADD_LOCATION %}
    <table cellpadding="5" align="center">
        <th colspan="2"><h3>Add Location</h3></th>
        <form action='/vs/addLocation' method='post'>
        {% csrf_token %}
        <c-errorMessage :err='err'></c-errorMessage> 
            <tr>
                <td class="label"><label for='name'>Name: </label></td>
                <td>
                    <input type='text' 
                    			id="name"
                    			name='name'
                                 size="30"
                                 maxlength="{{nameMaxLength}}"/>
                </td></tr>
            <tr>
                <td class="label">&nbsp;</td>
                <td>
                    <button
                    	type='submit' 
                        class="reset-style">Save</button>&nbsp;
                    <button 
                    type="button" 
                    onclick="window.location.href='/vs/home/'">
                    	Cancel
                    </button>
                </td></tr>
        </form>
    </table>
{% VSAuthorizer_end %}
{% VSAuthorizer _type=VIEW_LOCATIONS %}
{{table|safe}}
{% VSAuthorizer_end %}
{% endcotton %}
