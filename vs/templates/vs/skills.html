{% csrf_token %}
<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      
      
      
      
      >

    <body>
        <ui:composition template="./../template/default.xhtml">
            <ui:define name="content">
                <script>
                    function loaded() {
                        setHeader("Skills");
                    }
                </script>
                {% if test="#{Authorizerauthorize(AuthorizerRESOURCE_ADD_SKILL)}">
                    <h:outputText value="#{skillDetailsBean.refresh()}"/>
                    <h:outputText value="#{skillsBean.clearVolunteerBean()}"/>
                    <h:form id="form1">
                        <table cellpadding="5" align="center">
                            <th colspan="2"><h3>Add Skill</h3></th>
                            <tr>
                                <td class="label"><label for="name"
                                                                 rendered="true"
                                                                 value="Name:"/></td>
                                <td>
                                    <h:panelGrid columns="1">
                                    <input type='text' id="name"
                                                 size="30"
                                                 maxlength="#{skillsBean.skillNameMaxLength}"
                                                 value="#{skillsBean.name}"
                                                 required="false"/>
                                    <h:message for="name" styleClass="errorMsg"/>
                                    </h:panelGrid>
                                </td></tr>
                            <tr>
                                <td class="label">&nbsp;</td>
                                <td>
                                    <p:commandButton 
                                        styleClass="reset-style" 
                                       
                                        value="Save"
                                        action="#{skillsBean.submit}"/>
                                </td></tr>
                            <vscomp:updateError 
                                bean="#{skillsBean}"
                                colspan="2"/>
                        </table>
                    </h:form>
                {% endif %}
                {% if test="#{Authorizerauthorize(AuthorizerRESOURCE_UPDATE_SKILL)}">
                    <table class="listTable" border="1">
                        <h:outputText
                            escape="false"
                            value="#{skillsBean.table}"/>
                    </table>
                {% endif %}
            </ui:define>
        </ui:composition>
    </body>
</html>
