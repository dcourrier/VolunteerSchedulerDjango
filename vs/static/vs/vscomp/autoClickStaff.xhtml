<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:cc="http://xmlns.jcp.org/jsf/composite">

    <!-- INTERFACE -->
    <cc:interface>
        <cc:attribute name="bean" type="com.courrier.volunteer.web.backing.VolunteerBean"/>
        <cc:attribute name="label" type="java.lang.String"/>
    </cc:interface>

    <!-- IMPLEMENTATION -->
    <cc:implementation>
        <h:form>                                                
            <h:outputLabel 
                for="staffAutoClickSelect" 
                value="#{cc.attrs.label}"/>
            <h:selectBooleanCheckbox
                id="staffAutoClickSelect"
                value="#{cc.attrs.bean.staffAutoclicked}"
                onchange="clickComponentButton('staffAutoClickButton', 'autoClickButton')"/>
            &nbsp;
            <h:commandButton 
                id="staffAutoClickButton"
                styleClass="autoClickButton"
                value="Staff"
                action="#{cc.attrs.bean.staffAutoClick()}"/>
        </h:form>
    </cc:implementation>
</html>
