<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:j="http://java.sun.com/jsp/jstl/core"
      xmlns:cc="http://xmlns.jcp.org/jsf/composite">

    <!-- INTERFACE -->
    <cc:interface>
        <cc:attribute name="bean" type="com.courrier.volunteer.web.backing.VolschedBeanBase"/>
        <cc:attribute name="colspan" type="java.lang.String"/>
    </cc:interface>

    <!-- IMPLEMENTATION -->
    <cc:implementation>
        {% if test="#{cc.attrs.bean.error}">
            <tr>
                <td colspan="#{cc.attrs.colspan}" align="center" class="error">
                    <h:outputText 
                        rendered="#{cc.attrs.bean.error}"
                        escape="false"
                        value="#{cc.attrs.bean.errorMessage}"/>
                </td>
            </tr>
        {% endif %}
    </cc:implementation>
</html>
